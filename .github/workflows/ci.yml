name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make test-web
      - run: go build ./...
      - run: go build -o bin/pointvote ./cmd/pointvote
      - run: npm install --prefix "$RUNNER_TEMP/pointvote-browser" --no-audit --no-fund playwright@1.63.0
      - run: '"$RUNNER_TEMP/pointvote-browser/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Browser regression tests
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pointvote-browser/node_modules/playwright
        run: |
          ./bin/pointvote -addr 127.0.0.1:8092 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          for attempt in $(seq 1 50); do
            curl -sf http://127.0.0.1:8092/healthz >/dev/null && break
            sleep 0.1
          done
          node --test e2e/browser_test.cjs

  # Tag pushes also cut a release binary for the Pi (aarch64).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make release
      # Idempotent for re-pushed tags: create if absent, then (re)attach.
      - run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/pointvote-linux-arm64 --clobber
        env:
          GH_TOKEN: ${{ github.token }}
